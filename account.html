<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Join NaMe Magazine — member login and registration" />
  <title>Account — NaMe Magazine</title>
  <script src="auth-boot.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="experience.css" />
  <script src="experience.js" defer></script>
</head>
<body class="page-account" data-page-title="authPageTitle" data-page-description="authPageDescription">
  <header class="header header--minimal" id="header">
    <div class="header__top">
      <a href="./" class="logo"><span class="brand-mark">NaMe</span></a>
      <nav class="header__actions" aria-label="Quick actions">
        <a href="./" class="auth-page__back" data-i18n="backHome">← Back to NaMe</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-page__panel" aria-labelledby="auth-page-title">
      <div class="auth-page__panel-inner">
        <h1 id="auth-page-title" class="auth-page__title" data-i18n="authTitle">NaMe Account</h1>
        <p class="auth-page__subtitle" data-i18n="authPageSubtitle">Comment on a story, or send work to the desk.</p>

        <p id="auth-error" class="auth-error" hidden></p>

        <div class="auth-tabs auth-tabs--luxury">
          <button type="button" class="auth-tabs__btn is-active" data-auth-tab="login" data-i18n="authLogin">Login</button>
          <button type="button" class="auth-tabs__btn" data-auth-tab="register" data-i18n="authRegister">Join</button>
        </div>

        <form id="auth-login-form" class="auth-form auth-form--luxury" data-auth-panel="login" autocomplete="on">
          <label class="auth-field">
            <span data-i18n="authEmail">Email</span>
            <input type="email" name="loginEmail" data-login-email autocomplete="username" required />
          </label>
          <label class="auth-field">
            <span data-i18n="authPassword">Password</span>
            <input type="password" name="loginPassword" data-login-password autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn btn--primary btn--luxury" data-i18n="authLoginBtn">Login</button>
        </form>

        <form id="auth-register-form" class="auth-form auth-form--luxury is-hidden" data-auth-panel="register" autocomplete="on">
          <label class="auth-field">
            <span data-i18n="authDisplayName">Display name</span>
            <input type="text" name="registerName" data-register-name autocomplete="name" required />
          </label>
          <label class="auth-field">
            <span data-i18n="authEmail">Email</span>
            <input type="email" name="registerEmail" data-register-email autocomplete="email" required />
          </label>
          <label class="auth-field">
            <span data-i18n="authPasswordMin">Password (8+ characters)</span>
            <input type="password" name="registerPassword" data-register-password autocomplete="new-password" required minlength="8" />
          </label>
          <label class="auth-field">
            <span data-i18n="authPasswordConfirm">Confirm password</span>
            <input type="password" name="registerPasswordConfirm" data-register-password-confirm autocomplete="new-password" required minlength="8" />
          </label>
          <label class="auth-check">
            <input type="checkbox" data-register-agree-terms required />
            <span data-i18n-html="authAgreeTerms">I agree to the <a href="terms.html">Terms of Service</a></span>
          </label>
          <label class="auth-check">
            <input type="checkbox" data-register-subscribe />
            <span data-i18n="authSubscribeOptIn">I want to subscribe</span>
          </label>
          <button type="submit" class="btn btn--primary btn--luxury" data-i18n="authRegisterBtn">Create account</button>
        </form>
      </div>
    </section>
  </main>

  <script src="base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="auth-page.js"></script>
</body>
</html>
